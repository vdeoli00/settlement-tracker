name: Update settlements and deploy

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch settlements
        run: python scripts/update.py
      - name: Keep Supabase free project awake
        continue-on-error: true
        run: |
          URL=$(sed -n "s/.*supabaseUrl: '\([^']*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*supabaseKey: '\([^']*\)'.*/\1/p" config.js)
          curl -s -o /dev/null -w "supabase ping: %{http_code}\n" "$URL/rest/v1/user_data?select=user_id&limit=1" -H "apikey: $KEY"
      - name: Commit data if changed
        run: |
          git config user.name "settlement-bot"
          git config user.email "settlement-bot@users.noreply.github.com"
          git add data/settlements.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh settlements"
            # Retry if main moved during the run; our freshly fetched data wins on conflict.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi

  # Needs Settings -> Pages -> Source: "GitHub Actions" (one-time). Data updates above run either way.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # pick up the data commit made by the update job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
