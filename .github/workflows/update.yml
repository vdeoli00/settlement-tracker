name: Update settlements and deploy

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch settlements
        run: python scripts/update.py
      - name: Commit data if changed
        run: |
          git config user.name "settlement-bot"
          git config user.email "settlement-bot@users.noreply.github.com"
          git add data/settlements.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh settlements"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
